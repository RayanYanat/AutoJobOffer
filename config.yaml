# ============================================================================
# AutoJobOffer — Configuration
# ============================================================================
# Global keywords and locations are used for ALL companies unless overridden.
#
# IMPORTANT: Les URLs Workday (base_url, company_slug, site) doivent être
# vérifiées. Lance `python verify_sources.py` pour tester chaque source.
# ============================================================================

keywords:
  - analyst
  - analyste
  - finance
  - financier
  - risk
  - trading
  - M&A
  - advisory
  - investment banking
  - structuration
  - quant
  - portfolio
  - asset management
  - private equity
  - wealth management
  - corporate finance
  - credit
  - compliance
  - audit
  - treasury

locations:
  - Paris
  - London
  - Londres
  - Geneva
  - Genève
  - Zurich
  - Zürich
  - Frankfurt
  - Madrid
  - Milan
  - Milano
  - Amsterdam
  - Brussels
  - Bruxelles
  - Luxembourg
  - Dublin
  - Île-de-France
  - La Défense

delay_between_sources: 2  # seconds between each company scrape
max_age_days: 7  # ignore job postings older than this

